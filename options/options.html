<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocoon 黑名单管理</title>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">Cocoon</p>
          <h1>本地屏蔽管理</h1>
          <p class="intro">查看并修正保存在这台设备上的作者与标签。</p>
        </div>
        <dl class="totals" aria-label="本地屏蔽摘要">
          <div><dt>作者</dt><dd id="author-total">—</dd></div>
          <div><dt>标签</dt><dd id="tag-total">—</dd></div>
        </dl>
      </header>

      <p id="page-message" class="page-message" role="status">正在读取本地数据…</p>
      <p id="write-error" class="write-error" role="alert" tabindex="-1" hidden>更改未保存，请重试。</p>

      <section class="authors-panel" aria-labelledby="authors-heading">
        <div class="section-heading">
          <div>
            <p class="section-index">作者</p>
            <h2 id="authors-heading">屏蔽列表</h2>
          </div>
          <button id="remove-selected" class="danger-text" type="button" disabled>解除所选（0）</button>
        </div>

        <div class="toolbar" role="search">
          <label>
            <span>搜索作者</span>
            <input id="author-search" type="search" autocomplete="off" placeholder="输入作者显示名称">
          </label>
          <label>
            <span>标签</span>
            <select id="tag-filter"><option value="">全部标签</option></select>
          </label>
          <label>
            <span>首次屏蔽时间</span>
            <select id="time-sort">
              <option value="desc">最新在前</option>
              <option value="asc">最早在前</option>
            </select>
          </label>
        </div>

        <div class="table-header" aria-hidden="true">
          <span></span><span>作者</span><span>标签</span><span>来源</span><span>首次屏蔽</span><span></span>
        </div>
        <div id="author-viewport" class="author-viewport" tabindex="0" aria-label="屏蔽作者列表">
          <div id="author-list" class="author-list" role="list"></div>
        </div>
        <p id="list-summary" class="list-summary" aria-live="polite"></p>
      </section>

      <section class="tags-panel" aria-labelledby="tags-heading">
        <div class="section-heading">
          <div>
            <p class="section-index">标签</p>
            <h2 id="tags-heading" tabindex="-1">标签维护</h2>
          </div>
          <p id="tag-summary" aria-live="polite">— 个自定义标签</p>
        </div>
        <div class="tag-workbench">
          <div id="tag-list" class="tag-list" role="list"></div>
        </div>
      </section>
    </main>

    <dialog id="batch-dialog" aria-labelledby="batch-dialog-title" aria-describedby="batch-dialog-description">
      <form method="dialog">
        <h2 id="batch-dialog-title">解除所选作者</h2>
        <p id="batch-dialog-description"></p>
        <div class="dialog-actions">
          <button id="batch-cancel" value="cancel" type="button">取消</button>
          <button id="batch-confirm" value="confirm" type="button">确认解除</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/options/main.ts"></script>
  </body>
</html>
